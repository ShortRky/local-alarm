<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sleeper Alarm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Sleeper Alarm</h1>
            <p class="subtitle">Wakes even the heaviest sleepers</p>
        </header>

        <section class="set-alarm">
            <h2>Set New Alarm</h2>
            <div class="alarm-form">
                <div class="time-inputs">
                    <input type="number" id="hour" min="0" max="23" placeholder="HH" required>
                    <span>:</span>
                    <input type="number" id="minute" min="0" max="59" placeholder="MM" required>
                </div>
                <input type="text" id="label" placeholder="Label (optional)">
                <button id="set-alarm-btn">Set Alarm</button>
            </div>
        </section>

        <section class="alarms-list">
            <h2>Active Alarms</h2>
            <div id="alarms-container">
                <p class="no-alarms">No alarms set. Add one above!</p>
            </div>
        </section>

        <section class="alarm-active" id="alarm-active" style="display: none;">
            <h2>ALARM!</h2>
            <p class="alarm-label" id="active-alarm-label"></p>
            <p class="alarm-time" id="active-alarm-time"></p>
            <div class="alarm-controls">
                <button id="stop-btn" class="stop-btn">STOP</button>
                <button id="snooze-btn" class="snooze-btn">SNOOZE (5 min)</button>
            </div>
            <p class="intensity-hint" id="intensity-hint"></p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
